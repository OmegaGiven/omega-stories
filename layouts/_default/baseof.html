<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
    <link rel="stylesheet" href="{{ "css/styles.css" | relURL }}" />
  </head>
  <body data-section="{{ .Section }}">
    {{ partial "header.html" . }}
    <main class="container">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    <script src="{{ "js/theme.js" | relURL }}"></script>
    <script src="{{ "js/scroll-restore.js" | relURL }}"></script>
    <script src="{{ "js/header-scroll.js" | relURL }}"></script>
  </body>
</html>
