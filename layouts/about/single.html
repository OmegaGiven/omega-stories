{{ define "main" }}
<section class="about-section">
  <div class="about-grid">
    <article class="about-bubble">
      <header class="page-header">
        <p class="eyebrow">{{ .Section | title }}</p>
        {{ $author := .Params.author | default .Site.Params.author }}
        <h1>About {{ $author }}</h1>
      </header>
      <div class="prose">
        {{ .Content }}
      </div>
    </article>
  </div>
</section>
{{ end }}
